name: Bootstrap npm trusted publishing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install npm
        run: npm install --global npm@12.0.2
      - name: Configure and verify trusted publisher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm trust github polygres-sdk-effect \
            --file release.yml \
            --repo phall1/polygres-sdk-effect \
            --env npm \
            --allow-publish \
            --yes
          npm trust list polygres-sdk-effect --json
