name: Upstream contracts

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-contracts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          bun run contracts:refresh -- check --format human > contract-refresh.md 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - if: always()
        run: cat contract-refresh.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-refresh
          path: contract-refresh.md
      - if: steps.refresh.outputs.exit_code != '0'
        run: exit "${{ steps.refresh.outputs.exit_code }}"
